services:
  rent-radar:
    build: .
    image: rent-radar:latest
    container_name: rent-radar
    restart: unless-stopped
    env_file: .env
    environment:
      # Serwer liczy kilometry w linii prostej, nie minuty — brak klucza Google
      # jest tu decyzją, nie brakiem. Patrz geo.py.
      GOOGLE_MAPS_API_KEY: ""
      DB_PATH: /data/offers.db
    volumes:
      # Baza i wygenerowane pliki przeżywają przebudowę obrazu.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
