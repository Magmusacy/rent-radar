services:
  rent-radar:
    build: .
    image: rent-radar:latest
    container_name: rent-radar
    restart: unless-stopped
    env_file: .env
    environment:
      # The server measures straight-line kilometres, not minutes — the absent
      # Google key is a decision, not an oversight. See geo.py.
      GOOGLE_MAPS_API_KEY: ""
      DB_PATH: /data/offers.db
    volumes:
      # The database and generated files survive image rebuilds.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
